server.port=8080

# ------------------------------------------------------------------------
# CORS 허용 Origin
# ------------------------------------------------------------------------
# 프론트엔드를 로컬 개발 포트(3000)가 아닌 다른 호스트/포트에서 서빙하는 경우
# (예: 내부망 배포) CORS_ALLOWED_ORIGINS 환경변수로 실제 Origin을 넣어준다.
# 여러 개면 콤마로 구분: CORS_ALLOWED_ORIGINS=http://10.0.0.5:3000,http://10.0.0.5
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ------------------------------------------------------------------------
# 호스트 채번 - 테스트 DB(Oracle) 연동 설정
# ------------------------------------------------------------------------
# enabled=false(기본값)면 실제 DB에 연결하지 않고 HostNumberingService의 Mock
# 데이터로 동작한다 (테스트 DB 정보가 없어도 앱이 항상 뜨도록 하기 위함).
#
# 실제로 연동하려면 아래 값을 코드가 아니라 "환경변수"로 채워 넣는다 (비밀번호를
# 이 파일에 직접 적지 않는다):
#   TEST_DB_ENABLED=true
#   TEST_DB_URL=jdbc:oracle:thin:@//호스트:1521/서비스명(또는 SID)
#   TEST_DB_USERNAME=계정
#   TEST_DB_PASSWORD=비밀번호
#
# 테이블명(LINE_TCP_IP_INFO)은 확정됐지만 컬럼명은 아직 몰라서 HOST_CODE/PORT_NO로
# 임시 가정해뒀다 (확인 필요). enabled=true로 켠 뒤
#   GET /api/host-numbering/test-db/columns
# 를 호출하면 실제 컬럼 목록을 볼 수 있다. 확인되면 아래 두 값도 환경변수로 교체:
#   TEST_DB_CODE_COLUMN=실제 코드 컬럼명
#   TEST_DB_PORT_COLUMN=실제 포트 컬럼명
host-numbering.test-db.enabled=${TEST_DB_ENABLED:false}
host-numbering.test-db.url=${TEST_DB_URL:jdbc:oracle:thin:@//localhost:1521/ORCLPDB1}
host-numbering.test-db.username=${TEST_DB_USERNAME:}
host-numbering.test-db.password=${TEST_DB_PASSWORD:}
host-numbering.test-db.table=${TEST_DB_TABLE:LINE_TCP_IP_INFO}
host-numbering.test-db.code-column=${TEST_DB_CODE_COLUMN:HOST_CODE}
host-numbering.test-db.port-column=${TEST_DB_PORT_COLUMN:PORT_NO}
